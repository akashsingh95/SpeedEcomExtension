<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 344px;
      background: #fff;
      color: #111827;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }
    .top {
      display: flex; align-items: center; gap: 9px;
      padding: 12px 16px;
      background: #0f172a; color: #fff;
    }
    .logo-icon { width: 24px; height: 24px; flex-shrink: 0; border-radius: 6px; }
    .brand { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    .brand-sub { font-size: 10.5px; opacity: .62; margin-top: 1px; }

    /* ── Signed in: account bar + marketplace list ─────────────────────── */
    .account {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
    }
    .avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: #0f172a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 10.5px; font-weight: 700;
    }
    .acct-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .acct-name {
      font-size: 12px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .acct-email {
      font-size: 10.5px; color: #6b7280; margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .logout-btn {
      background: none; border: 0; cursor: pointer;
      color: #9ca3af; padding: 5px; border-radius: 5px;
      display: flex; align-items: center; flex-shrink: 0;
    }
    .logout-btn:hover { background: #fee2e2; color: #dc2626; }

    .hint { padding: 10px 16px 4px; font-size: 10.5px; color: #6b7280; }
    .list { padding: 2px 0 8px; }

    .row {
      display: flex; align-items: center; gap: 10px;
      width: 100%; text-align: left;
      padding: 10px 16px;
      background: none; border: 0; cursor: pointer;
      font: inherit; color: inherit;
    }
    .row:hover { background: #f3f4f6; }
    .row-mark {
      width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border: 1px solid #e5e7eb; overflow: hidden;
    }
    .row-mark img { width: 100%; height: 100%; object-fit: contain; }
    .row-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .row-name { font-size: 12.5px; font-weight: 600; }
    .row-status {
      font-size: 10.5px; color: #6b7280; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-status.busy { color: #2563eb; font-weight: 500; }
    .row-status.done { color: #16a34a; }
    .row-status.err  { color: #dc2626; }
    .bar {
      height: 3px; border-radius: 2px; background: #e5e7eb;
      margin-top: 5px; overflow: hidden; display: none;
    }
    .bar > i { display: block; height: 100%; background: #2563eb; width: 0%; }
    .row-go { font-size: 15px; color: #9ca3af; flex-shrink: 0; }
    .portal {
      background: none; border: 0; cursor: pointer;
      font: inherit; font-size: 10.5px; color: #2563eb;
      padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
    }
    .portal:hover { background: #eff6ff; text-decoration: underline; }

    /* ── Signed out: centralised login ──────────────────────────────────── */
    .login { padding: 20px 18px 18px; }
    .login-title { font-size: 14px; font-weight: 700; text-align: center; }
    .login-intro {
      font-size: 11.5px; color: #6b7280; text-align: center;
      margin-top: 5px; line-height: 1.5;
    }
    .login-input {
      width: 100%; margin-top: 9px;
      padding: 9px 11px;
      border: 1px solid #d1d5db; border-radius: 7px;
      font: inherit; font-size: 12.5px; color: #111827;
      background: #fff;
    }
    .login-input:focus { outline: none; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
    .login-field { position: relative; }
    .login-field.password .login-input { padding-right: 34px; }
    .pw-toggle {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 32px; border: 0; background: transparent;
      color: #9ca3af; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .pw-toggle:hover { color: #0f172a; }
    .pw-toggle .eye-off { display: none; }
    .pw-toggle.showing .eye { display: none; }
    .pw-toggle.showing .eye-off { display: block; }
    .login-btn {
      width: 100%; margin-top: 12px;
      padding: 10px; border: 0; border-radius: 7px;
      background: #0f172a; color: #fff;
      font: inherit; font-size: 12.5px; font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover:not(:disabled) { background: #1e293b; }
    .login-btn:disabled { opacity: .6; cursor: default; }
    .login-error {
      display: none;
      margin-top: 10px; padding: 8px 10px;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;
      color: #b91c1c; font-size: 11px; line-height: 1.45;
    }
    .login-foot {
      margin-top: 14px; text-align: center;
      font-size: 10.5px; color: #9ca3af; line-height: 1.5;
    }

    .foot {
      padding: 8px 16px; border-top: 1px solid #e5e7eb;
      font-size: 10.5px; color: #9ca3af; text-align: center;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="top">
    <img class="logo-icon" src="icons/icon48.png" alt="" />
    <div class="brand">
      <div class="brand-name">Speed Ecom</div>
      <div class="brand-sub">Amazon &middot; Meesho &middot; Myntra</div>
    </div>
  </div>

  <!-- Signed out -->
  <div class="login" id="loginView" hidden>
    <div class="login-title">Sign in to Speed Ecom</div>
    <div class="login-intro">One account for Amazon, Meesho and Myntra.</div>
    <input class="login-input" type="email" id="seLoginEmail" placeholder="Email address" autocomplete="username" />
    <div class="login-field password">
      <input class="login-input" type="password" id="seLoginPassword" placeholder="Password" autocomplete="current-password" />
      <button class="pw-toggle" id="sePwToggle" type="button" title="Show password" aria-label="Show password">
        <svg class="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61C3.35 8.36 1 12 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <button class="login-btn" id="seLoginBtn">Sign in</button>
    <div class="login-error" id="seLoginError"></div>
    <div class="login-foot">Signing in unlocks every marketplace panel.</div>
  </div>

  <!-- Signed in -->
  <div id="listView" hidden>
    <div class="account">
      <div class="avatar" id="avatar">&mdash;</div>
      <div class="acct-meta">
        <div class="acct-name" id="acctName">Signed in</div>
        <div class="acct-email" id="acctEmail"></div>
      </div>
      <button class="logout-btn" id="seLogoutBtn" title="Log out" aria-label="Log out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

    <div class="hint">Marketplaces</div>
    <div class="list" id="list"></div>
    <div class="foot">Open a seller portal to get the full panel</div>
  </div>

  <script src="se_shim.js"></script>
  <script src="chooser.js"></script>
</body>
</html>
